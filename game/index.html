<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find The Hidden Toy</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Consolas,monospace;
}

/* =========================================
   START
========================================= */

#awal{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eafaff;
    font-family:Arial,sans-serif;
}

.box{
    width:430px;
    padding:45px;
    background:white;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 70px #0003;
}

.box h1{
    font-size:32px;
    color:#202020;
}

.box p{
    color:#777;
    margin-bottom:30px;
}

.play{
    padding:16px 42px;
    border:0;
    border-radius:30px;
    background:#5878ff;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.play:hover{
    transform:scale(1.05);
}


/* =========================================
   MAIN SCREEN
========================================= */

#screen{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    color:#ddd;
    overflow:hidden;
}


/* =========================================
   TERMINAL
========================================= */

#terminal{
    position:absolute;
    inset:0;
    padding:45px;
    font-size:18px;
    line-height:1.8;
    color:#ddd;
}

.red{
    color:#ff2222;
}

.yellow{
    color:#ffd000;
}

.green{
    color:#32ff65;
}

.white{
    color:white;
}

.dim{
    color:#777;
}

.cursor{
    display:inline-block;
    width:10px;
    height:20px;
    background:#fff;
    animation:blink .5s infinite;
}

@keyframes blink{
    50%{opacity:0}
}


/* =========================================
   PROGRESS
========================================= */

.progress{
    width:430px;
    height:13px;
    border:1px solid #555;
    margin:12px 0 20px;
}

.progress div{
    width:0%;
    height:100%;
    background:#e60000;
    transition:.2s;
}


/* =========================================
   GLITCH
========================================= */

.glitch{
    animation:glitch .07s infinite;
}

@keyframes glitch{

    0%{
        transform:translate(0);
    }

    20%{
        transform:translate(-9px,4px);
    }

    40%{
        transform:translate(8px,-5px);
    }

    60%{
        transform:translate(-5px,-3px);
    }

    80%{
        transform:translate(7px,4px);
    }

    100%{
        transform:translate(0);
    }

}


/* =========================================
   RED FLASH
========================================= */

#flash{
    position:fixed;
    inset:0;
    background:red;
    opacity:0;
    z-index:100;
    pointer-events:none;
}


/* =========================================
   BLACK SCREEN
========================================= */

#black{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:200;
    justify-content:center;
    align-items:center;
    color:#555;
    font-size:18px;
}


/* =========================================
   IMAGE REVEAL
========================================= */

#reveal{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:300;
    overflow:hidden;
}

#image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
}


/* =========================================
   IMAGE PIECES
========================================= */

#pieces{
    position:absolute;
    inset:0;
    display:grid;

    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr);

    z-index:10;
}

.piece{
    background-image:url("cyber-horror.png");
    background-size:400% 400%;
    background-repeat:no-repeat;

    opacity:0;

    transform:
        scale(.15)
        rotate(12deg);

    transition:
        opacity .12s,
        transform .35s cubic-bezier(.2,.8,.2,1);
}


/* image positions */

.piece:nth-child(1){background-position:0% 0%}
.piece:nth-child(2){background-position:33.33% 0%}
.piece:nth-child(3){background-position:66.66% 0%}
.piece:nth-child(4){background-position:100% 0%}

.piece:nth-child(5){background-position:0% 33.33%}
.piece:nth-child(6){background-position:33.33% 33.33%}
.piece:nth-child(7){background-position:66.66% 33.33%}
.piece:nth-child(8){background-position:100% 33.33%}

.piece:nth-child(9){background-position:0% 66.66%}
.piece:nth-child(10){background-position:33.33% 66.66%}
.piece:nth-child(11){background-position:66.66% 66.66%}
.piece:nth-child(12){background-position:100% 66.66%}

.piece:nth-child(13){background-position:0% 100%}
.piece:nth-child(14){background-position:33.33% 100%}
.piece:nth-child(15){background-position:66.66% 100%}
.piece:nth-child(16){background-position:100% 100%}


.piece.show{
    opacity:1;
    transform:scale(1) rotate(0deg);
}


/* =========================================
   IMAGE TEXT
========================================= */

#loadingImage{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    color:#ff2222;
    font-size:18px;
    z-index:30;
    text-shadow:0 0 12px red;
}


/* =========================================
   JUMPSCARE
========================================= */

#jumpscare{
    position:fixed;
    inset:0;
    background:#000;
    z-index:500;
    display:none;
}

#jumpscare img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================================
   HACKED TEXT
========================================= */

#hacked{
    position:absolute;
    inset:0;
    z-index:550;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.18);

    text-align:center;

    opacity:0;
}

#hacked.show{
    opacity:1;
}

#hacked h1{
    margin:0;
    color:#ff1111;

    font-size:clamp(45px,8vw,110px);

    text-shadow:
        0 0 10px red,
        0 0 30px red;

    animation:textGlitch .08s infinite;
}

#hacked p{
    color:white;
    font-size:25px;
    letter-spacing:4px;
}

@keyframes textGlitch{

    0%{
        transform:translate(0);
    }

    50%{
        transform:translate(8px,-3px);
    }

    100%{
        transform:translate(-6px,3px);
    }

}


/* =========================================
   ERROR SPAM
========================================= */

#errorSpam{
    position:fixed;
    inset:0;
    z-index:700;

    display:none;

    pointer-events:none;
}

.errorBox{
    position:absolute;

    width:280px;
    padding:20px;

    background:#111;
    border:2px solid #777;

    color:#fff;

    box-shadow:0 0 20px #000;

    font-family:Arial;
}

.errorBox b{
    color:#ff3333;
}


/* =========================================
   FINAL PRANK
========================================= */

#prank{
    position:fixed;
    inset:0;

    z-index:1000;

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    background:#050505;

    text-align:center;
}

#prank h1{
    font-family:Arial;
    font-size:70px;
    margin:0;

    color:#55ff66;

    text-shadow:0 0 25px #22ff44;
}

#prank p{
    color:#ddd;
    font-family:Arial;
    font-size:22px;
}

.playAgain{
    margin-top:25px;
    padding:14px 35px;

    border:1px solid #55ff66;
    background:transparent;

    color:#55ff66;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;
}


/* =========================================
   SCANLINES
========================================= */

.scanlines{
    position:fixed;
    inset:0;

    z-index:900;

    pointer-events:none;

    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 2px,
        transparent 5px
    );
}

</style>
</head>

<body>


<!-- =========================================
     START GAME
========================================= -->

<div id="awal">

    <div class="box">

        <h1>🧸 Find The Hidden Toy!</h1>

        <p>Can you find the hidden toy?</p>

        <button class="play" onclick="mulai()">
            PLAY NOW
        </button>

    </div>

</div>


<!-- =========================================
     SYSTEM TERMINAL
========================================= -->

<div id="screen">

    <div id="terminal"></div>

</div>


<!-- =========================================
     BLACK SCREEN
========================================= -->

<div id="black">
    CONNECTION LOST...
</div>


<!-- =========================================
     IMAGE REVEAL
========================================= -->

<div id="reveal">

    <div id="loadingImage">
        LOADING IMAGE... 0%
    </div>

    <img id="image" src="cyber-horror.png">

    <div id="pieces">

        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>
        <div class="piece"></div>

    </div>

</div>


<!-- =========================================
     JUMPSCARE
========================================= -->

<div id="jumpscare">

    <img src="cyber-horror.png">

    <div id="hacked">

        <h1>YOUR SYSTEM<br>HAS BEEN HACKED</h1>

        <p>CONNECTION LOST...</p>

    </div>

</div>


<!-- =========================================
     ERROR SPAM
========================================= -->

<div id="errorSpam"></div>


<!-- =========================================
     FINAL PRANK
========================================= -->

<div id="prank">

    <h1>PRANKED! 😭</h1>

    <p>
        Relax bro 😂<br>
        It was just a browser simulation.
    </p>

    <p>
        No files or personal data were accessed.
    </p>

    <button class="playAgain" onclick="location.reload()">
        PLAY AGAIN
    </button>

</div>


<div id="flash"></div>

<div class="scanlines"></div>


<script>


/* =========================================
   ELEMENT
========================================= */

const awal =
document.getElementById("awal");

const screen =
document.getElementById("screen");

const terminal =
document.getElementById("terminal");

const black =
document.getElementById("black");

const reveal =
document.getElementById("reveal");

const image =
document.getElementById("image");

const pieces =
document.querySelectorAll(".piece");

const jumpscare =
document.getElementById("jumpscare");

const hacked =
document.getElementById("hacked");

const errorSpam =
document.getElementById("errorSpam");

const prank =
document.getElementById("prank");

const flash =
document.getElementById("flash");

const loadingImage =
document.getElementById("loadingImage");


/* =========================================
   FULLSCREEN
========================================= */

function fullscreen(){

    if(document.documentElement.requestFullscreen){

        document.documentElement
        .requestFullscreen()
        .catch(()=>{});

    }

}


/* =========================================
   START
========================================= */

function mulai(){

    awal.style.display="none";

    screen.style.display="block";

    fullscreen();

    systemSequence();

}


/* =========================================
   TERMINAL
========================================= */

const logs = [

    ["SYSTEM INITIALIZATION...", "white"],

    ["> Establishing secure connection...", "dim"],

    ["> Checking system environment...", "dim"],

    ["> Connection established.", "green"],

    ["", ""],

    ["SECURITY SCAN STARTED", "red"],

    ["> Scanning active processes...", "dim"],

    ["> Checking system integrity...", "dim"],

    ["> Analyzing network activity...", "dim"],

    ["> Checking suspicious connections...", "dim"],

    ["", ""],

    ["WARNING: UNKNOWN ACTIVITY DETECTED", "yellow"],

    ["> Attempting to isolate threat...", "dim"],

    ["> Isolation failed.", "red"],

    ["", ""],

    ["!!! SECURITY BREACH DETECTED !!!", "red"],

    ["> Unauthorized activity detected.", "red"],

    ["> System control status: UNKNOWN", "yellow"],

    ["", ""],

    ["CRITICAL ERROR", "red"],

    ["> System response unstable.", "red"],

    ["> Emergency shutdown sequence...", "red"],

    ["", ""],

    ["SYSTEM FAILURE", "red"],

    ["> Connection lost.", "red"]

];


function systemSequence(){

    let i=0;

    function next(){

        if(i>=logs.length){

            setTimeout(startBlack,1000);

            return;

        }

        let line=logs[i];

        let div=document.createElement("div");

        div.className=line[1];

        div.innerHTML=line[0] || "&nbsp;";

        terminal.appendChild(div);

        window.scrollTo(0,document.body.scrollHeight);

        i++;

        let delay =
            line[0].includes("BREACH") ? 700 :
            line[0].includes("ERROR") ? 500 :
            180;

        setTimeout(next,delay);

    }

    next();

}


/* =========================================
   RANDOM GLITCH
========================================= */

setTimeout(()=>{

    screen.classList.add("glitch");

    setTimeout(()=>{

        screen.classList.remove("glitch");

    },500);

},3500);


/* =========================================
   BLACK SCREEN
========================================= */

function startBlack(){

    screen.style.display="none";

    black.style.display="flex";

    setTimeout(()=>{

        black.style.display="none";

        startReveal();

    },3500);

}


/* =========================================
   IMAGE REVEAL
========================================= */

function startReveal(){

    reveal.style.display="block";

    let shuffled =
        Array.from(pieces);

    shuffled.sort(
        ()=>Math.random()-.5
    );

    shuffled.forEach((piece,index)=>{

        setTimeout(()=>{

            piece.classList.add("show");

            let percent =
                Math.round(
                    ((index+1)/pieces.length)*100
                );

            loadingImage.innerText =
                "LOADING IMAGE... "
                +percent+"%";

            if(index%3===0){

                reveal.classList.add("glitch");

                setTimeout(()=>{

                    reveal.classList.remove("glitch");

                },100);

            }

        },index*220);

    });


    setTimeout(()=>{

        image.style.opacity="1";

        pieces.forEach(p=>{
            p.style.opacity="0";
        });

        loadingImage.innerText =
            "IMAGE LOAD COMPLETE";

    },pieces.length*220+400);


    setTimeout(()=>{

        jumpscareNow();

    },pieces.length*220+1000);

}


/* =========================================
   JUMPSCARE
========================================= */

function jumpscareNow(){

    reveal.style.display="none";

    jumpscare.style.display="block";

    /*
       flash
    */

    flash.style.opacity="1";

    setTimeout(()=>{

        flash.style.opacity="0";

    },80);


    /*
       glitch
    */

    jumpscare.classList.add("glitch");

    setTimeout(()=>{

        jumpscare.classList.remove("glitch");

    },800);


    /*
       hacked text
    */

    setTimeout(()=>{

        hacked.classList.add("show");

    },500);


    /*
       lanjut error spam
    */

    setTimeout(()=>{

        startErrorSpam();

    },2200);

}


/* =========================================
   ERROR SPAM
========================================= */

function startErrorSpam(){

    hacked.classList.remove("show");

    errorSpam.style.display="block";

    let count=0;

    let interval=setInterval(()=>{

        createError();

        count++;

        if(count>=18){

            clearInterval(interval);

            setTimeout(()=>{

                errorSpam.style.display="none";

                jumpscare.style.display="none";

                prank.style.display="flex";

            },1800);

        }

    },180);

}


/* =========================================
   CREATE ERROR WINDOW
========================================= */

function createError(){

    let box=
    document.createElement("div");

    box.className="errorBox";

    box.innerHTML=`

        <b>⚠ CRITICAL ERROR</b>
        <br><br>

        System has stopped responding.
        <br><br>

        Error Code:
        0x00000005
        <br>

        Access denied.
        <br><br>

        <button
        onclick="this.parentElement.remove()"
        style="
        padding:6px 18px;
        cursor:pointer;
        ">
        OK
        </button>

    `;


    box.style.left =
        Math.random()*75+"%";

    box.style.top =
        Math.random()*75+"%";


    errorSpam.appendChild(box);

}


/* =========================================
   ESC = EXIT
========================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Escape"){

            if(document.fullscreenElement){

                document.exitFullscreen()
                .catch(()=>{});

            }

            location.reload();

        }

    }
);

</script>

</body>
</html>
